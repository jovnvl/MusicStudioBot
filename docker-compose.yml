services:
  postgres:
    image: postgres:16
    container_name: musicstudio-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: music_studio_bot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management
    container_name: musicstudio_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672" 
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
   
  redis:
    image: redis:7-alpine
    container_name: musicstudio_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - musicstudio_network

volumes:
  postgres_data:
  rabbitmq_data:
  redis_data:
  
networks:
  musicstudio_network:
    driver: bridge